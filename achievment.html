<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up Life — Achievements</title>
<style>
  :root {
    --navy: #0F172A;
    --card-bg: #131C2E;
    --card-border: #223049;
    --text-dim: #8B96AC;
    --teal: #0EA5A0;
    --orange: #F97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #EAF0FA;
    padding: 32px 20px 60px 20px;
  }
  .page { max-width: 560px; margin: 0 auto; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

  .progress-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .progress-summary .count { font-size: 20px; font-weight: 700; color: var(--orange); }
  .progress-summary .label { font-size: 12px; color: var(--text-dim); }

  .badges-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
  }

  .badge-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #16233F;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge-icon svg { width: 26px; height: 26px; }

  .badge.locked .badge-icon { background: #14192A; }
  .badge.locked .badge-icon svg { opacity: 0.35; }
  .badge.locked .badge-label { color: var(--text-dim); }

  .badge-label { font-size: 12px; font-weight: 600; }
  .badge-desc { font-size: 10px; color: var(--text-dim); }

  @media (max-width: 480px) {
    body { padding: 20px 12px 40px 12px; }
    .page-title { font-size: 19px; }
    .badges-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .badge-icon { width: 48px; height: 48px; }
  }

  @media (min-width: 900px) {
    .page { max-width: 680px; }
    .badges-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<div class="page">

  <div class="page-title">Achievements</div>
  <div class="page-sub">Unlock badges by completing quests and building streaks.</div>

  <div class="progress-summary">
    <div>
      <div class="count">4 / 10</div>
      <div class="label">Badges unlocked</div>
    </div>
    <div style="font-size:28px;">🏅</div>
  </div>

  <div class="badges-grid" id="badgesGrid"></div>

</div>

<script>
  const badges = [
    { name: "Bookworm", desc: "Read 5 chapters", locked: false, color: "#3B82F6",
      icon: `<path d="M12 12 C20 8 28 8 32 12 L32 52 C28 48 20 48 12 52 Z" fill="#3B82F6"/><path d="M52 12 C44 8 36 8 32 12 L32 52 C36 48 44 48 52 52 Z" fill="#3B82F6"/>` },
    { name: "7-Day Streak", desc: "7 days in a row", locked: false, color: "#EF4444",
      icon: `<path d="M32 6 C36 16 44 20 44 32 C44 42 38 50 28 50 C18 50 12 42 14 32 C15 27 18 25 18 25 C18 30 21 32 23 30 C21 22 26 14 32 6 Z" fill="#EF4444"/>` },
    { name: "First Quest", desc: "Complete 1 quest", locked: false, color: "#22C55E",
      icon: `<path d="M4 12 L10 18 L20 6" stroke="#22C55E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(20,20) scale(1.3)"/>` },
    { name: "Early Bird", desc: "5 quests before 8am", locked: false, color: "#F59E0B",
      icon: `<circle cx="32" cy="34" r="16" fill="#F59E0B"/><path d="M32 6 L32 14 M12 34 L4 34 M60 34 L52 34" stroke="#F59E0B" stroke-width="3"/>` },
    { name: "30-Day Streak", desc: "30 days in a row", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` },
    { name: "Level 10", desc: "Reach level 10", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` },
    { name: "Max Strength", desc: "Strength level 10", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` },
    { name: "100 Quests", desc: "Complete 100 quests", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` },
    { name: "Social", desc: "Add 3 friends", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` },
    { name: "Top 3", desc: "Reach top 3 on leaderboard", locked: true, color: "#8B96AC",
      icon: `<rect x="16" y="28" width="32" height="24" rx="4"/><path d="M22 28 L22 18 C22 12 27 8 32 8 C37 8 42 12 42 18 L42 28" fill="none"/>` }
  ];

  const grid = document.getElementById('badgesGrid');
  grid.innerHTML = badges.map(b => `
    <div class="badge ${b.locked ? 'locked' : ''}">
      <div class="badge-icon">
        <svg viewBox="0 0 64 64" fill="none" stroke="${b.locked ? '#8B96AC' : b.color}" stroke-width="4">
          ${b.icon}
        </svg>
      </div>
      <div class="badge-label">${b.locked ? 'Locked' : b.name}</div>
      <div class="badge-desc">${b.desc}</div>
    </div>
  `).join('');
</script>

</body>
</html>
