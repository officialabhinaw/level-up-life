<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up Life — Quests</title>
<style>
  :root {
    --navy: #0F172A;
    --card-bg: #131C2E;
    --card-border: #223049;
    --text-dim: #8B96AC;
    --teal: #0EA5A0;
    --orange: #F97316;
    --strength: #EF4444;
    --intellect: #3B82F6;
    --agility: #22C55E;
    --discipline: #F59E0B;
    --purple: #7C3AED;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #070B14;
    color: #EAF0FA;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .mobile-container {
    width: 100%;
    max-width: 412px;
    min-height: 100vh;
    background: var(--navy);
    padding: 20px 16px 90px 16px;
    position: relative;
    overflow-y: auto;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
  }

  @media(min-width: 480px) {
    .mobile-container {
      border-radius: 36px;
      border: 8px solid #1E293B;
      height: 844px;
      min-height: 844px;
    }
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .page-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .add-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .add-input {
    flex: 1;
    background: #0F1626;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 9px 12px;
    color: #EAF0FA;
    font-size: 13px;
  }

  .add-input:focus {
    outline: none;
    border-color: var(--teal);
  }

  .select-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .stat-select, .xp-select {
    flex: 1;
    background: #0F1626;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 9px 10px;
    color: #EAF0FA;
    font-size: 13px;
  }

  .add-btn {
    width: 100%;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    color: white;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab.active {
    background: var(--teal);
    color: white;
    border-color: var(--teal);
  }

  .quest {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s ease;
  }

  .quest:hover { border-color: var(--teal); }

  .quest.done { opacity: 0.5; }
  .quest.done .quest-name { text-decoration: line-through; }

  .quest-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .quest.done .quest-check {
    background: var(--teal);
    border-color: var(--teal);
  }

  .quest-check svg {
    width: 11px; height: 11px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .quest.done .quest-check svg { opacity: 1; }

  .quest-body { flex: 1; }

  .quest-name {
    font-size: 14px;
    font-weight: 600;
  }

  .quest-meta {
    display: flex;
    gap: 6px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .stat-pill {
    padding: 2px 7px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 10px;
  }

  .pill-strength { background: rgba(239,68,68,0.15); color: var(--strength); }
  .pill-intellect { background: rgba(59,130,246,0.15); color: var(--intellect); }
  .pill-agility { background: rgba(34,197,94,0.15); color: var(--agility); }
  .pill-discipline { background: rgba(245,158,11,0.15); color: var(--discipline); }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
  }

  .delete-btn:hover { color: var(--strength); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 0;
  }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
  }

  .nav-item {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .nav-item.active {
    color: var(--teal);
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
</style>
</head>
<body>

<div class="mobile-container">

  <div class="page-title">Your Quests</div>
  <div class="page-sub">Add a task, tie it to a stat, and level up when completed.</div>

  <div class="add-card">
    <div class="add-row">
      <input class="add-input" id="questNameInput" type="text" placeholder="What's the quest?">
    </div>
    <div class="select-row">
      <select class="stat-select" id="questStatSelect">
        <option value="strength">Strength</option>
        <option value="intellect">Intellect</option>
        <option value="agility">Agility</option>
        <option value="discipline">Discipline</option>
      </select>
      <select class="xp-select" id="questXPSelect">
        <option value="5">+5 XP</option>
        <option value="10" selected>+10 XP</option>
        <option value="15">+15 XP</option>
        <option value="20">+20 XP</option>
      </select>
    </div>
    <button class="add-btn" onclick="addQuest()">Add Quest</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-filter="all" onclick="setFilter(this)">All</div>
    <div class="tab" data-filter="pending" onclick="setFilter(this)">Pending</div>
    <div class="tab" data-filter="done" onclick="setFilter(this)">Completed</div>
  </div>

  <div id="questList"></div>

  <div class="bottom-nav">
      <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
      <a href="quest.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Quests</a>
      <a href="achievment.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 5h-4.15C14.3 3.61 13.25 2.5 12 2.5s-2.3 1.11-2.85 2.5H5c-1.1 0-2 .9-2 2v2c0 2.55 1.92 4.63 4.4 4.94C7.85 15.77 9.7 18.13 10.5 19.5v2.5h3v-2.5c.8-1.37 2.65-3.73 3.1-5.56 2.48-.31 4.4-2.39 4.4-4.94V7c0-1.1-.9-2-2-2z"/></svg>Badges</a>
      <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const STAT_LABELS = {
    strength: "Strength",
    intellect: "Intellect",
    agility: "Agility",
    discipline: "Discipline"
  };

  let quests = JSON.parse(localStorage.getItem('quests')) || [
    { id: 1, name: "1 hour DSA practice", stat: "intellect", xp: 15, done: false },
    { id: 2, name: "Gym / workout", stat: "strength", xp: 10, done: false },
    { id: 3, name: "Morning run", stat: "agility", xp: 8, done: true }
  ];

  let currentFilter = 'all';

  function saveQuests() {
    localStorage.setItem('quests', JSON.stringify(quests));
  }

  function addQuest() {
    const nameInput = document.getElementById('questNameInput');
    const name = nameInput.value.trim();
    const stat = document.getElementById('questStatSelect').value;
    const xp = parseInt(document.getElementById('questXPSelect').value, 10);

    if (!name) return;

    quests.push({
      id: Date.now(),
      name: name,
      stat: stat,
      xp: xp,
      done: false
    });

    nameInput.value = "";
    saveQuests();
    renderQuests();
  }

  function toggleQuest(id) {
    const quest = quests.find(q => q.id === id);
    quest.done = !quest.done;
    saveQuests();
    renderQuests();

    if (quest.done) {
      showToast('+' + quest.xp + ' ' + STAT_LABELS[quest.stat] + ' XP');
    }
  }

  function deleteQuest(id, event) {
    event.stopPropagation();
    quests = quests.filter(q => q.id !== id);
    saveQuests();
    renderQuests();
  }

  function setFilter(tabEl) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    currentFilter = tabEl.dataset.filter;
    renderQuests();
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function renderQuests() {
    const list = document.getElementById('questList');
    let filtered = quests;

    if (currentFilter === 'pending') filtered = quests.filter(q => !q.done);
    if (currentFilter === 'done') filtered = quests.filter(q => q.done);

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No quests here yet.</div>';
      return;
    }

    list.innerHTML = filtered.map(q => `
      <div class="quest ${q.done ? 'done' : ''}" onclick="toggleQuest(${q.id})">
        <div class="quest-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <path d="M4 12 L10 18 L20 6"/>
          </svg>
        </div>
        <div class="quest-body">
          <div class="quest-name">${q.name}</div>
          <div class="quest-meta">
            <span class="stat-pill pill-${q.stat}">${STAT_LABELS[q.stat]}</span>
            <span>+${q.xp} XP</span>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteQuest(${q.id}, event)">&times;</button>
      </div>
    `).join('');
  }

  renderQuests();
</script>

</body>
</html>
