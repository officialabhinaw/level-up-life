<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up Life — Page Not Found</title>
<style>
  :root {
    --navy: #0F172A;
    --card-bg: #131C2E;
    --card-border: #223049;
    --text-dim: #8B96AC;
    --teal: #0EA5A0;
    --orange: #F97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #EAF0FA;
    padding: 20px;
  }

  .error-card { text-align: center; max-width: 380px; }

  .error-code {
    font-size: 84px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }

  .icon-wrap {
    width: 90px;
    height: 90px;
    margin: 12px auto 20px auto;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-wrap svg { width: 42px; height: 42px; }

  .error-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }

  .error-desc {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .home-btn {
    display: inline-block;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    border: none;
    color: white;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }

  @media (max-width: 480px) {
    .error-code { font-size: 64px; }
    .error-title { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="error-card">
  <div class="error-code">404</div>
  <div class="icon-wrap">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="24" fill="none" stroke="#F97316" stroke-width="4"/>
      <path d="M24 24 L40 40 M40 24 L24 40" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="error-title">This quest doesn't exist</div>
  <div class="error-desc">The page you're looking for got lost on the map. Let's get you back to base.</div>
  <a class="home-btn" href="dashboard.html">Back to Dashboard</a>
</div>

</body>
</html>
