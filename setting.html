<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up Life — Settings</title>
<style>
  :root {
    --navy: #0F172A;
    --card-bg: #131C2E;
    --card-border: #223049;
    --text-dim: #8B96AC;
    --teal: #0EA5A0;
    --orange: #F97316;
    --danger: #EF4444;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #070B14;
    color: #EAF0FA;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* Hide scrollbar for IE, Edge and Firefox */
    -ms-overflow-style: none;  
    scrollbar-width: none;  
  }

  /* Hide scrollbar for Chrome, Safari and Opera */
  body::-webkit-scrollbar {
    display: none;
  }

  .mobile-container {
    width: 100%;
    max-width: 412px;
    min-height: 100vh;
    background: var(--navy);
    padding: 20px 16px; 
    position: relative;
    overflow-y: auto;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    /* Hide scrollbar for IE, Edge and Firefox */
    -ms-overflow-style: none;  
    scrollbar-width: none;  
  }

  /* Hide scrollbar for Chrome, Safari and Opera */
  .mobile-container::-webkit-scrollbar {
    display: none;
  }

  @media(min-width: 480px) {
    .mobile-container {
      border-radius: 36px;
      border: 8px solid #1E293B;
      height: 844px;
      min-height: 844px;
    }
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .section {
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .profile-edit {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--card-border);
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--orange));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .change-photo-btn {
    font-size: 11px;
    color: var(--teal);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-top: 3px;
  }

  .field {
    padding: 12px 14px;
    border-bottom: 1px solid var(--card-border);
  }

  .field:last-child { border-bottom: none; }

  .field-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .field-input {
    width: 100%;
    background: #0F1626;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 10px;
    color: #EAF0FA;
    font-size: 13px;
  }

  .field-input:focus {
    outline: none;
    border-color: var(--teal);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--card-border);
  }

  .toggle-row:last-child { border-bottom: none; }

  .toggle-text-main {
    font-size: 13px;
    font-weight: 600;
  }

  .toggle-text-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: var(--card-border);
    border-radius: 22px;
    transition: 0.2s;
  }

  .slider::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.2s;
  }

  input:checked + .slider {
    background-color: var(--teal);
  }

  input:checked + .slider::before {
    transform: translateX(18px);
  }

  .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--card-border);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .link-row:last-child { border-bottom: none; }

  .link-row:hover {
    background: rgba(255,255,255,0.03);
  }

  .link-row-text {
    font-size: 13px;
    font-weight: 500;
  }

  .link-row-arrow {
    color: var(--text-dim);
    font-size: 15px;
  }

  .save-btn {
    width: 100%;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    margin-top: 4px;
  }

  .logout-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    cursor: pointer;
    margin-top: 16px;
  }

  .logout-btn:hover {
    background: rgba(239,68,68,0.08);
  }

  .toast {
    position: fixed;
    bottom: 40px; 
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="mobile-container">

  <div class="page-title">Settings</div>

  <div class="section">
    <div class="section-label">Profile</div>
    <div class="card">
      <div class="profile-edit">
        <div class="avatar" id="avatarInitials">AK</div>
        <div>
          <div style="font-weight:700; font-size:14px;" id="profileNamePreview">Abhinaw</div>
          <button class="change-photo-btn">Change photo</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Display name</div>
        <input class="field-input" id="nameInput" type="text" value="Abhinaw">
      </div>
      <div class="field">
        <div class="field-label">Email</div>
        <input class="field-input" id="emailInput" type="email" value="abhinaw@example.com">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Security</div>
    <div class="card">
      <div class="field">
        <div class="field-label">Current password</div>
        <input class="field-input" type="password" placeholder="Enter current password">
      </div>
      <div class="field">
        <div class="field-label">New password</div>
        <input class="field-input" type="password" placeholder="Enter new password">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Preferences</div>
    <div class="card">
      <div class="toggle-row">
        <div>
          <div class="toggle-text-main">Push notifications</div>
          <div class="toggle-text-sub">Get reminders for your daily quests</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="notifToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-text-main">Dark mode</div>
          <div class="toggle-text-sub">Use dark theme across the app</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="darkToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-text-main">Public profile</div>
          <div class="toggle-text-sub">Show your stats on the leaderboard</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="publicToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Account</div>
    <div class="card">
      <div class="link-row" onclick="window.location.href='profile.html'">
        <div class="link-row-text">View profile</div>
        <div class="link-row-arrow">›</div>
      </div>
      <div class="link-row" onclick="alert('Export coming soon')">
        <div class="link-row-text">Export my data</div>
        <div class="link-row-arrow">›</div>
      </div>
      <div class="link-row" onclick="if(confirm('Delete your account? This cannot be undone.')) alert('Account deletion requested')">
        <div class="link-row-text" style="color:#EF4444;">Delete account</div>
        <div class="link-row-arrow">›</div>
      </div>
    </div>
  </div>

  <button class="save-btn" onclick="saveSettings()">Save Changes</button>
  <button class="logout-btn" onclick="logout()">Log Out</button>

</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  window.onload = function() {
    const savedName = localStorage.getItem('username');
    if (savedName) {
      document.getElementById('nameInput').value = savedName;
      document.getElementById('profileNamePreview').innerText = savedName;
      const initials = savedName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('avatarInitials').innerText = initials;
    }

    const savedEmail = localStorage.getItem('userEmail');
    if (savedEmail) {
      document.getElementById('emailInput').value = savedEmail;
    }
  };

  document.getElementById('nameInput').addEventListener('input', function() {
    document.getElementById('profileNamePreview').innerText = this.value;
    const initials = this.value.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('avatarInitials').innerText = initials || 'U';
  });

  function saveSettings() {
    const name = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();

    localStorage.setItem('username', name);
    localStorage.setItem('userEmail', email);
    localStorage.setItem('notifEnabled', document.getElementById('notifToggle').checked);
    localStorage.setItem('darkMode', document.getElementById('darkToggle').checked);
    localStorage.setItem('publicProfile', document.getElementById('publicToggle').checked);

    showToast('Settings saved');
  }

  function logout() {
    localStorage.removeItem('username');
    localStorage.removeItem('userEmail');
    localStorage.removeItem('userType');
    showToast('Logged out');
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  }
</script>

</body>
</html>
